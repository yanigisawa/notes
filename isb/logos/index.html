<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISB Logo Designs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    padding: 1rem;
  }
  h1 {
    text-align: center;
    margin-bottom: 2rem;
    font-size: 1.5rem;
  }
  .option {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .option-label {
    font-size: 1.25rem;
    font-weight: 600;
    padding: 1rem;
    background: #2c3e50;
    color: #fff;
  }
  .option img {
    display: block;
    width: 100%;
    height: auto;
    padding: 1rem;
    object-fit: contain;
  }

  @media (min-width: 768px) {
    body { padding: 2rem 3rem; }
    h1 { font-size: 2rem; }
    .option {
      display: flex;
      align-items: center;
    }
    .option-label {
      flex: 0 0 220px;
      text-align: center;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }
    .option img {
      flex: 1;
      max-height: 400px;
      width: auto;
      max-width: 100%;
    }
  }
</style>
</head>
<body>
<h1>ISB Logo Designs</h1>

<div class="option">
  <div class="option-label">Option 1</div>
  <img src="1000015996.png" alt="Option 1">
</div>

  <img src="capitol_Indianapolis_Symphonic_Band_Logo.png" alt="Option 2">
</div>

</div>

  <img src="p-1option-2.png" alt="Option 4">
</div>

<div class="option">

  <img src="p1-option-3.png" alt="Option 5">
</div>

<div class="option">

  <img src="p2-option-1-v1.png" alt="Option 6">

</html>
